<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poo Class Persona</title>
</head>
<body>
    <main class="contenedor">
        <h1>Ejercicio 1: Clases y Objetos</h1>
        <p class="subtitulo">Registro de personas y converción en <strong>objetos</strong></p>

        <form id="formPersona" class="formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="0" required>

            <label for="profesion">Profesion:</label>
            <input type="text" id="profesion" required>

            <button type="submit">Crear Objeto Persona</button>
        </form>

        <section>
            <h2>Personas Registradas (objetos creados)</h2>
            <div id="listaPersonas" class="lista"></div>
        </section>

    </main>

<script src="./js/app.js"></script>    
</body>
</html>
